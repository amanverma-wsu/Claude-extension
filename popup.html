<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <h1>Claude Usage</h1>
      <button id="reset" title="Reset tracked state">Reset</button>
    </header>
    <section class="card">
      <div id="empty" class="muted">Open Settings → Usage on claude.ai to populate this panel.</div>
      <div id="content" style="display:none;">
        <div class="block">
          <div class="row"><span class="label">Current session</span><span id="s-pct" class="value">--</span></div>
          <div class="progress"><div id="s-bar" class="bar"></div></div>
          <div class="sub"><span id="s-msgs">--</span><span id="s-reset">--</span></div>
        </div>
        <div class="block">
          <div class="row"><span class="label">Weekly</span><span id="w-pct" class="value">--</span></div>
          <div class="progress"><div id="w-bar" class="bar"></div></div>
          <div class="sub"><span></span><span id="w-reset">--</span></div>
        </div>
      </div>
    </section>
    <footer>
      <span id="org" class="muted">No org detected</span>
      <span id="seen" class="muted"></span>
    </footer>
    <script src="popup.js"></script>
  </body>
</html>
